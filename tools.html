---
layout: page
title: 工具
---

<div class="tools-container">
  <div class="tools-tabs">
    <button class="tools-tab active" onclick="switchTab(this,'b64')">Base64</button>
    <button class="tools-tab" onclick="switchTab(this,'url')">URL</button>
    <button class="tools-tab" onclick="switchTab(this,'hex')">Hex</button>
    <button class="tools-tab" onclick="switchTab(this,'ts')">时间戳</button>
    <button class="tools-tab" onclick="switchTab(this,'json')">JSON</button>
    <button class="tools-tab" onclick="switchTab(this,'hash')">Hash</button>
  </div>

  <!-- Base64 -->
  <div id="tab-b64" class="tools-panel active">
    <div class="tool-row">
      <div class="tool-field">
        <label>输入</label>
        <textarea id="b64-input" class="tool-textarea tool-textarea--half" placeholder="输入文本或 Base64 字符串"></textarea>
      </div>
      <div class="tool-buttons">
        <button class="tool-btn" onclick="b64Encode()">编码 &darr;</button>
        <button class="tool-btn" onclick="b64Decode()">解码 &uarr;</button>
        <button class="tool-btn tool-btn-secondary" onclick="b64Swap()">交换 &#8644;</button>
        <button class="tool-btn tool-btn-secondary" onclick="clearFields('b64-input','b64-output')">清空</button>
      </div>
      <div class="tool-field">
        <label>输出</label>
        <textarea id="b64-output" class="tool-textarea tool-textarea--half" placeholder="输出结果" readonly></textarea>
      </div>
    </div>
  </div>

  <!-- URL -->
  <div id="tab-url" class="tools-panel">
    <div class="tool-row">
      <div class="tool-field">
        <label>输入</label>
        <textarea id="url-input" class="tool-textarea tool-textarea--half" placeholder="输入文本或 URL 编码字符串"></textarea>
      </div>
      <div class="tool-buttons">
        <button class="tool-btn" onclick="urlEncode()">encodeURI &darr;</button>
        <button class="tool-btn" onclick="urlDecode()">decodeURI &uarr;</button>
        <button class="tool-btn tool-btn-secondary" onclick="urlEncodeComponent()">encodeURIComponent &darr;</button>
        <button class="tool-btn tool-btn-secondary" onclick="urlDecodeComponent()">decodeURIComponent &uarr;</button>
        <button class="tool-btn tool-btn-secondary" onclick="urlSwap()">交换 &#8644;</button>
        <button class="tool-btn tool-btn-secondary" onclick="clearFields('url-input','url-output')">清空</button>
      </div>
      <div class="tool-field">
        <label>输出</label>
        <textarea id="url-output" class="tool-textarea tool-textarea--half" placeholder="输出结果" readonly></textarea>
      </div>
    </div>
  </div>

  <!-- Hex -->
  <div id="tab-hex" class="tools-panel">
    <div class="tool-row">
      <div class="tool-field">
        <label>输入</label>
        <textarea id="hex-input" class="tool-textarea" placeholder="输入文本或 Hex 字符串 (如 48 65 6C 6C 6F)"></textarea>
      </div>
      <div class="tool-buttons">
        <button class="tool-btn" onclick="hexEncode()">文本 &rarr; Hex &darr;</button>
        <button class="tool-btn" onclick="hexDecode()">Hex &rarr; 三种编码 &uarr;</button>
        <button class="tool-btn tool-btn-secondary" onclick="clearFields('hex-input','hex-out-unicode','hex-out-acp','hex-out-utf8')">清空</button>
      </div>
      <div class="tool-field">
        <label>Unicode (UTF-16LE)</label>
        <textarea id="hex-out-unicode" class="tool-textarea" placeholder="按 UTF-16LE 解码" readonly></textarea>
      </div>
      <div class="tool-field">
        <label>ACP (GBK)</label>
        <textarea id="hex-out-acp" class="tool-textarea" placeholder="按 GBK 解码" readonly></textarea>
      </div>
      <div class="tool-field">
        <label>UTF-8</label>
        <textarea id="hex-out-utf8" class="tool-textarea" placeholder="按 UTF-8 解码" readonly></textarea>
      </div>
    </div>
  </div>

  <!-- Timestamp -->
  <div id="tab-ts" class="tools-panel">
    <div class="tool-row">
      <div class="tool-field">
        <label>Unix 时间戳 (秒)</label>
        <input type="text" id="ts-input" class="tool-input" placeholder="如 1700000000">
      </div>
      <div class="tool-buttons">
        <button class="tool-btn" onclick="tsToDate()">时间戳 &rarr; 日期 &darr;</button>
        <button class="tool-btn" onclick="dateToTs()">日期 &rarr; 时间戳 &uarr;</button>
        <button class="tool-btn tool-btn-secondary" onclick="tsNow()">当前时间戳</button>
      </div>
      <div class="tool-field">
        <label>日期时间</label>
        <input type="text" id="ts-output" class="tool-input" placeholder="如 2023-11-15 06:13:20">
      </div>
    </div>
  </div>

  <!-- JSON -->
  <div id="tab-json" class="tools-panel">
    <textarea id="json-input" class="tool-textarea" style="min-height:120px" placeholder='输入 JSON 字符串，如 {"name":"test","value":123}'></textarea>
    <div class="tool-buttons" style="margin:8px 0">
      <button class="tool-btn" onclick="jsonFormat()">格式化</button>
      <button class="tool-btn" onclick="jsonCompress()">压缩</button>
      <button class="tool-btn tool-btn-secondary" onclick="jsonCopy()">复制结果</button>
      <button class="tool-btn tool-btn-secondary" onclick="jsonClear()">清空</button>
    </div>
    <pre id="json-output" class="json-output" style="display:none"></pre>
  </div>

  <!-- Hash -->
  <div id="tab-hash" class="tools-panel">
    <div class="tool-row">
      <textarea id="hash-input" class="tool-textarea" placeholder="输入文本计算 Hash，或点击下方按钮选择文件"></textarea>
      <div class="tool-buttons">
        <button class="tool-btn" onclick="hashText()">计算文本 Hash</button>
        <button class="tool-btn tool-btn-secondary" onclick="document.getElementById('hash-file').click()">选择文件</button>
        <input type="file" id="hash-file" style="display:none" onchange="hashFile(this)">
        <button class="tool-btn tool-btn-secondary" onclick="clearFields('hash-input','hash-out-md5','hash-out-crc32','hash-out-sha1','hash-out-sha256')">清空</button>
      </div>
      <div id="hash-file-info" style="font-size:0.8em;color:#888;margin-bottom:4px"></div>
      <div class="tool-field">
        <label>MD5</label>
        <input id="hash-out-md5" class="tool-input" readonly onclick="this.select()">
      </div>
      <div class="tool-field">
        <label>CRC32</label>
        <input id="hash-out-crc32" class="tool-input" readonly onclick="this.select()">
      </div>
      <div class="tool-field">
        <label>SHA-1</label>
        <input id="hash-out-sha1" class="tool-input" readonly onclick="this.select()">
      </div>
      <div class="tool-field">
        <label>SHA-256</label>
        <input id="hash-out-sha256" class="tool-input" readonly onclick="this.select()">
      </div>
    </div>
  </div>

</div>

<script>
function switchTab(btn, name) {
  document.querySelectorAll('.tools-panel').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.tools-tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

function clearFields() {
  for (var i = 0; i < arguments.length; i++) {
    document.getElementById(arguments[i]).value = '';
  }
}

// Base64
function b64Encode() {
  var input = document.getElementById('b64-input').value;
  try {
    document.getElementById('b64-output').value = btoa(unescape(encodeURIComponent(input)));
  } catch(e) {
    document.getElementById('b64-output').value = '编码错误: ' + e.message;
  }
}
function b64Decode() {
  var input = document.getElementById('b64-input').value;
  try {
    document.getElementById('b64-output').value = decodeURIComponent(escape(atob(input)));
  } catch(e) {
    document.getElementById('b64-output').value = '解码错误: 无效的 Base64 字符串';
  }
}
function b64Swap() {
  var a = document.getElementById('b64-input'), b = document.getElementById('b64-output');
  var tmp = a.value; a.value = b.value; b.value = '';
}

// URL
function urlEncode() {
  document.getElementById('url-output').value = encodeURI(document.getElementById('url-input').value);
}
function urlDecode() {
  try {
    document.getElementById('url-output').value = decodeURI(document.getElementById('url-input').value);
  } catch(e) {
    document.getElementById('url-output').value = '解码错误: ' + e.message;
  }
}
function urlEncodeComponent() {
  document.getElementById('url-output').value = encodeURIComponent(document.getElementById('url-input').value);
}
function urlDecodeComponent() {
  try {
    document.getElementById('url-output').value = decodeURIComponent(document.getElementById('url-input').value);
  } catch(e) {
    document.getElementById('url-output').value = '解码错误: ' + e.message;
  }
}
function urlSwap() {
  var a = document.getElementById('url-input'), b = document.getElementById('url-output');
  var tmp = a.value; a.value = b.value; b.value = '';
}

// Hex
function hexToBytes(hex) {
  var cleaned = hex.replace(/[^0-9a-fA-F]/g, '');
  if (cleaned.length % 2 !== 0) return null;
  var bytes = new Uint8Array(cleaned.length / 2);
  for (var i = 0; i < cleaned.length; i += 2) {
    bytes[i / 2] = parseInt(cleaned.substr(i, 2), 16);
  }
  return bytes;
}
function bytesToHex(bytes) {
  var hex = [];
  for (var i = 0; i < bytes.length; i++) {
    hex.push(bytes[i].toString(16).toUpperCase().padStart(2, '0'));
  }
  return hex.join(' ');
}
function textToUtf16LE(str) {
  var bytes = [];
  for (var i = 0; i < str.length; i++) {
    var code = str.charCodeAt(i);
    bytes.push(code & 0xFF);
    bytes.push((code >> 8) & 0xFF);
  }
  return new Uint8Array(bytes);
}
function hexEncode() {
  var input = document.getElementById('hex-input').value;
  if (!input) {
    document.getElementById('hex-out-unicode').value = '';
    document.getElementById('hex-out-acp').value = '';
    document.getElementById('hex-out-utf8').value = '';
    return;
  }
  // UTF-8
  document.getElementById('hex-out-utf8').value = bytesToHex(new TextEncoder().encode(input));
  // UTF-16LE
  document.getElementById('hex-out-unicode').value = bytesToHex(textToUtf16LE(input));
  // GBK: 浏览器 TextEncoder 不支持 GBK，用 TextDecoder 反查
  try {
    var gbkEncoder = new TextEncoder('gbk');
    document.getElementById('hex-out-acp').value = bytesToHex(gbkEncoder.encode(input));
  } catch(e) {
    document.getElementById('hex-out-acp').value = '浏览器不支持 GBK 编码输出';
  }
}
function hexDecode() {
  var bytes = hexToBytes(document.getElementById('hex-input').value);
  if (!bytes) {
    document.getElementById('hex-out-unicode').value = 'Hex 长度必须为偶数';
    document.getElementById('hex-out-acp').value = '';
    document.getElementById('hex-out-utf8').value = '';
    return;
  }
  try { document.getElementById('hex-out-unicode').value = new TextDecoder('utf-16le').decode(bytes); }
  catch(e) { document.getElementById('hex-out-unicode').value = '解码失败'; }
  try { document.getElementById('hex-out-acp').value = new TextDecoder('gbk').decode(bytes); }
  catch(e) { document.getElementById('hex-out-acp').value = '解码失败'; }
  try { document.getElementById('hex-out-utf8').value = new TextDecoder('utf-8').decode(bytes); }
  catch(e) { document.getElementById('hex-out-utf8').value = '解码失败'; }
}

// Timestamp
function tsToDate() {
  var ts = parseInt(document.getElementById('ts-input').value.trim());
  if (isNaN(ts)) {
    document.getElementById('ts-output').value = '请输入有效的时间戳';
    return;
  }
  if (ts > 1e12) ts = Math.floor(ts / 1000);
  var d = new Date(ts * 1000);
  document.getElementById('ts-output').value = formatDate(d);
}
function dateToTs() {
  var dateStr = document.getElementById('ts-output').value.trim();
  var d = new Date(dateStr);
  if (isNaN(d.getTime())) {
    document.getElementById('ts-input').value = '请输入有效的日期 (如 2023-11-15 06:13:20)';
    return;
  }
  document.getElementById('ts-input').value = Math.floor(d.getTime() / 1000);
}
function tsNow() {
  document.getElementById('ts-input').value = Math.floor(Date.now() / 1000);
}
function formatDate(d) {
  var pad = function(n) { return n < 10 ? '0' + n : n; };
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
    ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

// JSON
function jsonTryParse(str) {
  try { return { obj: JSON.parse(str), fixed: false }; } catch(e) {}
  var s = str;
  s = s.replace(/\/\/.*$/gm, '');
  s = s.replace(/\/\*[\s\S]*?\*\//g, '');
  s = s.replace(/'/g, '"');
  s = s.replace(/,\s*([\]}])/g, '$1');
  s = s.replace(/([{,]\s*)([a-zA-Z_$][a-zA-Z0-9_$]*)\s*:/g, '$1"$2":');
  try { return { obj: JSON.parse(s), fixed: true }; } catch(e2) {}
  return null;
}
function jsonShowOutput(text, errorLines) {
  var pre = document.getElementById('json-output');
  var lines = text.split('\n');
  var html = '';
  for (var i = 0; i < lines.length; i++) {
    var ln = i + 1;
    var escaped = lines[i].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    if (errorLines.indexOf(ln) >= 0) {
      html += '<span class="json-error-line">' + escaped + '</span>\n';
    } else {
      html += escaped + '\n';
    }
  }
  pre.innerHTML = html;
  pre.style.display = 'block';
}
function jsonFormat() {
  var input = document.getElementById('json-input').value.trim();
  if (!input) return;
  var result = jsonTryParse(input);
  if (result) {
    var out = JSON.stringify(result.obj, null, 2);
    if (result.fixed) out = '/* 已自动修复格式，请核对 */\n' + out;
    jsonShowOutput(out, []);
  } else {
    var r = jsonTolerantFormat(input);
    jsonShowOutput(r.text, r.errorLines);
  }
}
function jsonCompress() {
  var input = document.getElementById('json-input').value.trim();
  if (!input) return;
  var result = jsonTryParse(input);
  if (result) {
    var out = JSON.stringify(result.obj);
    if (result.fixed) out = '/* 已自动修复格式，请核对 */' + out;
    jsonShowOutput(out, []);
  } else {
    jsonShowOutput(jsonTolerantCompress(input), []);
  }
}
function jsonCopy() {
  var pre = document.getElementById('json-output');
  if (!pre.textContent) return;
  navigator.clipboard.writeText(pre.textContent).then(function() {
    alert('已复制到剪贴板');
  });
}
function jsonClear() {
  document.getElementById('json-input').value = '';
  var pre = document.getElementById('json-output');
  pre.innerHTML = '';
  pre.style.display = 'none';
}
function jsonTolerantFormat(str) {
  var out = '', indent = 0, inStr = false, esc = false;
  var stack = [], errorLines = [], lineNum = 1;
  // 状态追踪：检测对象/数组中各位置的语法错误
  var expectKey = false;   // 对象中 { 或 , 后，期望 key
  var expectColon = false; // key 后，期望 :
  var expectValue = false; // : 或 [ 或 , 后，期望 value
  var pendingKey = false;  // 正在读取一个可能是 key 的字符串

  var pad = function(n) { var s = ''; for (var i = 0; i < n; i++) s += '  '; return s; };
  var isStrStart = function(p) { return '{,[: \t\n\r'.indexOf(p) >= 0 || p === ''; };
  var isStrEnd = function(n) { return '},]: \t\n\r'.indexOf(n) >= 0 || n === ''; };
  var markError = function() { if (errorLines.indexOf(lineNum) < 0) errorLines.push(lineNum); };
  var inObject = function() { return stack.length > 0 && stack[stack.length - 1] === '}'; };

  for (var i = 0; i < str.length; i++) {
    var c = str[i], prev = i > 0 ? str[i - 1] : '', next = i < str.length - 1 ? str[i + 1] : '';

    if (esc) { out += c; esc = false; continue; }
    if (c === '\\' && inStr) { out += c; esc = true; continue; }

    // 引号处理（启发式 + 状态追踪）
    if (c === '"' || c === "'") {
      if (!inStr) {
        if (isStrStart(prev)) {
          inStr = true; out += '"';
          if (expectKey && inObject()) {
            pendingKey = true; expectKey = false;  // 对象中的 key
          } else if (expectValue) {
            expectValue = false;  // 值
          }
        } else {
          out += c; markError();  // 孤立引号，保留但不切换状态
        }
        continue;
      } else {
        if (isStrEnd(next)) {
          inStr = false; out += '"';
          if (pendingKey) { expectColon = true; pendingKey = false; }
        } else {
          out += '"'; markError();  // 字符串内嵌引号，保留
        }
        continue;
      }
    }

    if (inStr) { out += c; if (c === '\n') lineNum++; continue; }

    // 结构字符 + 状态追踪
    if (c === '{' || c === '[') {
      if (expectKey && inObject()) { markError(); expectKey = false; }
      out += c + '\n' + pad(++indent); lineNum++;
      stack.push(c === '{' ? '}' : ']');
      expectKey = (c === '{');
      expectValue = (c === '[');
      expectColon = false; pendingKey = false;
    } else if (c === '}' || c === ']') {
      if (stack.length > 0 && stack[stack.length - 1] === c) {
        stack.pop(); indent = Math.max(0, indent - 1);
        out += '\n' + pad(indent) + c; lineNum++;
      } else {
        var idx = stack.lastIndexOf(c);
        if (idx >= 0) { stack.splice(idx); indent = stack.length; out += '\n' + pad(indent) + c; lineNum++; markError(); }
        else { out += c; markError(); }
      }
      expectKey = false; expectColon = false; expectValue = false; pendingKey = false;
    } else if (c === ':') {
      if (!expectColon && !pendingKey) markError();  // 冒号不在期望位置
      expectColon = false; pendingKey = false;
      expectValue = true;
      out += ': ';
    } else if (c === ',') {
      if (inObject()) { expectKey = true; expectValue = false; }
      else { expectValue = true; expectKey = false; }
      expectColon = false; pendingKey = false;
      out += c + '\n' + pad(indent); lineNum++;
    } else if (' \t\n\r'.indexOf(c) >= 0) {
      // skip
    } else {
      // 普通字符（数字、标识符等）
      if (expectKey && inObject()) markError();  // 对象中期望 key 却出现裸值
      if (expectColon) markError();  // key 后没有冒号
      expectKey = false; expectColon = false; expectValue = false;
      out += c;
    }
  }
  return { text: out, errorLines: errorLines };
}
function jsonTolerantCompress(str) {
  var out = '', inStr = false, esc = false;
  var isStrStart = function(p) { return '{,[: \t\n\r'.indexOf(p) >= 0 || p === ''; };
  var isStrEnd = function(n) { return '},]: \t\n\r'.indexOf(n) >= 0 || n === ''; };
  for (var i = 0; i < str.length; i++) {
    var c = str[i], prev = i > 0 ? str[i - 1] : '', next = i < str.length - 1 ? str[i + 1] : '';
    if (esc) { out += c; esc = false; continue; }
    if (c === '\\' && inStr) { out += c; esc = true; continue; }
    if (c === '"' || c === "'") {
      if (!inStr) {
        if (isStrStart(prev)) { inStr = true; out += '"'; }
        else out += c;
        continue;
      } else {
        if (isStrEnd(next)) { inStr = false; out += '"'; }
        else out += '"';
        continue;
      }
    }
    if (inStr) { out += c; continue; }
    if (' \t\n\r'.indexOf(c) >= 0) continue;
    out += c;
  }
  return out;
}

// Hash
var crc32Table = (function() {
  var t = new Uint32Array(256);
  for (var i = 0; i < 256; i++) {
    var c = i;
    for (var j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c;
  }
  return t;
})();
function computeCRC32(bytes) {
  var crc = 0xFFFFFFFF;
  for (var i = 0; i < bytes.length; i++) crc = crc32Table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return ((crc ^ 0xFFFFFFFF) >>> 0).toString(16).toUpperCase().padStart(8, '0');
}

var md5 = (function() {
  function add32(a, b) { return (a + b) & 0xFFFFFFFF; }
  function cmn(q, a, b, x, s, t) { a = add32(add32(a, q), add32(x, t)); return add32((a << s) | (a >>> (32 - s)), b); }
  function ff(a, b, c, d, x, s, t) { return cmn((b & c) | ((~b) & d), a, b, x, s, t); }
  function gg(a, b, c, d, x, s, t) { return cmn((b & d) | (c & (~d)), a, b, x, s, t); }
  function hh(a, b, c, d, x, s, t) { return cmn(b ^ c ^ d, a, b, x, s, t); }
  function ii(a, b, c, d, x, s, t) { return cmn(c ^ (b | (~d)), a, b, x, s, t); }
  function cycle(x, k) {
    var a=x[0],b=x[1],c=x[2],d=x[3];
    a=ff(a,b,c,d,k[0],7,-680876936);d=ff(d,a,b,c,k[1],12,-389564586);c=ff(c,d,a,b,k[2],17,606105819);b=ff(b,c,d,a,k[3],22,-1044525330);
    a=ff(a,b,c,d,k[4],7,-176418897);d=ff(d,a,b,c,k[5],12,1200080426);c=ff(c,d,a,b,k[6],17,-1473231341);b=ff(b,c,d,a,k[7],22,-45705983);
    a=ff(a,b,c,d,k[8],7,1770035416);d=ff(d,a,b,c,k[9],12,-1958414417);c=ff(c,d,a,b,k[10],17,-42063);b=ff(b,c,d,a,k[11],22,-1990404162);
    a=ff(a,b,c,d,k[12],7,1804603682);d=ff(d,a,b,c,k[13],12,-40341101);c=ff(c,d,a,b,k[14],17,-1502002290);b=ff(b,c,d,a,k[15],22,1236535329);

async function shaHex(algo, bytes) {
  var hash = await crypto.subtle.digest(algo, bytes);
  return Array.from(new Uint8Array(hash)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
}

function hashText() {
  var text = document.getElementById('hash-input').value;
  if (!text) return;
  document.getElementById('hash-file-info').textContent = '';
  computeHashes(new TextEncoder().encode(text));
}
function hashFile(input) {
  var file = input.files[0];
  if (!file) return;
  document.getElementById('hash-file-info').textContent = '文件: ' + file.name + '  大小: ' + file.size + ' bytes';
  var reader = new FileReader();
  reader.onload = function(e) { computeHashes(new Uint8Array(e.target.result)); };
  reader.readAsArrayBuffer(file);
}
async function computeHashes(bytes) {
  document.getElementById('hash-out-md5').value = md5(bytes);
  document.getElementById('hash-out-crc32').value = computeCRC32(bytes);
  document.getElementById('hash-out-sha1').value = await shaHex('SHA-1', bytes);
  document.getElementById('hash-out-sha256').value = await shaHex('SHA-256', bytes);
}
